[package]
name = "theme-rewriter-lab-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local development Worker for the portable Theme Tools Rust HTML rewriter"

[lib]
crate-type = ["cdylib"]

[dependencies]
shared_core = { package = "theme-rewriter-lab-core", path = "../core" }
worker = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
