name: Verify AgentSam Theme Tools
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: npm run cli -- inspect examples/basic

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test portable Rust rewriter
        run: cargo test --locked --manifest-path rust/theme-rewriter-lab/Cargo.toml
      - name: Check Rust Worker WebAssembly
        run: cargo check --locked --target wasm32-unknown-unknown --manifest-path rust/theme-rewriter-lab/Cargo.toml

  sam-sdk-bridge:
    name: Public SAM authoring bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Theme Tools source
        uses: actions/checkout@v4
      - name: Checkout canonical AgentSam SDK main
        uses: actions/checkout@v4
        with:
          repository: SamPrimeaux/agentsam-sdk
          ref: main
          path: agentsam-sdk-integration
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Theme Tools workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install SDK public API dependencies
        working-directory: agentsam-sdk-integration
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require real compiler and five SAM operations
        env:
          AGENTSAM_SDK_ROOT: ${{ github.workspace }}/agentsam-sdk-integration
        run: node scripts/verify-agentsam-bridge.mjs
